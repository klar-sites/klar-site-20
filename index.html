<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --todo-rx7-bg: #141415;
        --todo-rx7-surface: #1c1c1e;
        --todo-rx7-surface-hover: #2a2a2e;
        --todo-rx7-border: #3a3a3e;
        --todo-rx7-primary: #f5bf4f;
        --todo-rx7-primary-glow: rgba(245, 191, 79, 0.25);
        --todo-rx7-primary-hover: #f7cc6e;
        --todo-rx7-danger: #e5534b;
        --todo-rx7-danger-glow: rgba(229, 83, 75, 0.2);
        --todo-rx7-text: #e8e8ec;
        --todo-rx7-text-muted: #8b8b93;
        --todo-rx7-text-done: #55555e;
        --todo-rx7-success: #4daa57;
        --todo-rx7-radius: 14px;
        --todo-rx7-transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--todo-rx7-bg);
        color: var(--todo-rx7-text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
      }

      .todo-rx7-bg-orbs {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .todo-rx7-bg-orbs::before,
      .todo-rx7-bg-orbs::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.12;
      }

      .todo-rx7-bg-orbs::before {
        width: 500px;
        height: 500px;
        background: var(--todo-rx7-primary);
        top: -150px;
        right: -100px;
        animation: todo-rx7-float 15s ease-in-out infinite;
      }

      .todo-rx7-bg-orbs::after {
        width: 400px;
        height: 400px;
        background: #e5534b;
        bottom: -100px;
        left: -100px;
        animation: todo-rx7-float 18s ease-in-out infinite reverse;
      }

      @keyframes todo-rx7-float {

        0%,
        100% {
          transform: translate(0, 0);
        }

        33% {
          transform: translate(30px, -30px);
        }

        66% {
          transform: translate(-20px, 20px);
        }
      }

      #todo-rx7-root {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 560px;
      }

      .todo-rx7-app-container {
        background: var(--todo-rx7-surface);
        border: 1px solid var(--todo-rx7-border);
        border-radius: 20px;
        padding: 36px;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      }

      .todo-rx7-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .todo-rx7-header-icon {
        font-size: 40px;
        margin-bottom: 8px;
        display: block;
      }

      .todo-rx7-header h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #f5bf4f, #f7cc6e, #fad888);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
      }

      .todo-rx7-header p {
        color: var(--todo-rx7-text-muted);
        font-size: 14px;
        margin-top: 4px;
      }

      .todo-rx7-input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
      }

      .todo-rx7-input-field {
        flex: 1;
        background: var(--todo-rx7-bg);
        border: 1.5px solid var(--todo-rx7-border);
        border-radius: var(--todo-rx7-radius);
        padding: 14px 18px;
        font-size: 15px;
        color: var(--todo-rx7-text);
        font-family: inherit;
        outline: none;
        transition: var(--todo-rx7-transition);
      }

      .todo-rx7-input-field::placeholder {
        color: var(--todo-rx7-text-muted);
      }

      .todo-rx7-input-field:focus {
        border-color: var(--todo-rx7-primary);
        box-shadow: 0 0 0 3px var(--todo-rx7-primary-glow);
      }

      .todo-rx7-add-btn {
        background: var(--todo-rx7-primary);
        color: #1c1c1e;
        border: none;
        border-radius: var(--todo-rx7-radius);
        padding: 14px 22px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: var(--todo-rx7-transition);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .todo-rx7-add-btn:hover {
        background: var(--todo-rx7-primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 16px var(--todo-rx7-primary-glow);
      }

      .todo-rx7-add-btn:active {
        transform: translateY(0);
      }

      .todo-rx7-filters-row {
        display: flex;
        gap: 6px;
        margin-bottom: 20px;
        background: var(--todo-rx7-bg);
        border-radius: 10px;
        padding: 4px;
      }

      .todo-rx7-filter-btn {
        flex: 1;
        padding: 9px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--todo-rx7-text-muted);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--todo-rx7-transition);
      }

      .todo-rx7-filter-btn:hover {
        color: var(--todo-rx7-text);
      }

      .todo-rx7-filter-btn--active {
        background: var(--todo-rx7-surface);
        color: var(--todo-rx7-text);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .todo-rx7-stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding: 0 4px;
      }

      .todo-rx7-stats-text {
        font-size: 13px;
        color: var(--todo-rx7-text-muted);
      }

      .todo-rx7-stats-text span {
        color: var(--todo-rx7-primary-hover);
        font-weight: 600;
      }

      .todo-rx7-clear-btn {
        background: none;
        border: none;
        color: var(--todo-rx7-danger);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: var(--todo-rx7-transition);
      }

      .todo-rx7-clear-btn:hover {
        background: var(--todo-rx7-danger-glow);
      }

      .todo-rx7-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .todo-rx7-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--todo-rx7-bg);
        border: 1px solid var(--todo-rx7-border);
        border-radius: 12px;
        padding: 14px 16px;
        transition: var(--todo-rx7-transition);
        animation: todo-rx7-slide-in 0.3s ease-out;
        user-select: none;
      }

      @keyframes todo-rx7-slide-in {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .todo-rx7-item:hover {
        border-color: rgba(245, 191, 79, 0.25);
        background: var(--todo-rx7-surface-hover);
      }

      .todo-rx7-item--done .todo-rx7-item-text {
        text-decoration: line-through;
        color: var(--todo-rx7-text-done);
      }

      .todo-rx7-item--dragging {
        opacity: 0.5;
        border-color: var(--todo-rx7-primary);
        box-shadow: 0 0 0 2px var(--todo-rx7-primary-glow);
      }

      .todo-rx7-item--drag-over {
        border-color: var(--todo-rx7-primary);
        background: var(--todo-rx7-surface-hover);
        box-shadow: 0 0 0 2px var(--todo-rx7-primary-glow);
      }

      .todo-rx7-checkbox {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--todo-rx7-border);
        cursor: pointer;
        transition: var(--todo-rx7-transition);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: transparent;
        padding: 0;
      }

      .todo-rx7-checkbox:hover {
        border-color: var(--todo-rx7-primary);
      }

      .todo-rx7-checkbox--checked {
        background: var(--todo-rx7-success);
        border-color: var(--todo-rx7-success);
      }

      .todo-rx7-checkbox--checked svg {
        display: block;
      }

      .todo-rx7-checkbox svg {
        display: none;
        width: 12px;
        height: 12px;
        stroke: #fff;
        stroke-width: 3;
        fill: none;
      }

      .todo-rx7-item-text {
        flex: 1;
        font-size: 15px;
        line-height: 1.4;
        transition: var(--todo-rx7-transition);
      }

      .todo-rx7-drag-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        color: var(--todo-rx7-text-muted);
        padding: 4px 2px;
        border-radius: 6px;
        transition: var(--todo-rx7-transition);
        flex-shrink: 0;
        opacity: 0;
      }

      .todo-rx7-drag-handle:hover {
        color: var(--todo-rx7-text);
        background: rgba(255,255,255,0.05);
      }

      .todo-rx7-drag-handle:active {
        cursor: grabbing;
      }

      .todo-rx7-item:hover .todo-rx7-drag-handle {
        opacity: 1;
      }

      .todo-rx7-drag-handle svg {
        width: 16px;
        height: 16px;
      }

      .todo-rx7-delete-btn {
        background: none;
        border: none;
        color: var(--todo-rx7-text-muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        transition: var(--todo-rx7-transition);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        flex-shrink: 0;
      }

      .todo-rx7-item:hover .todo-rx7-delete-btn {
        opacity: 1;
      }

      .todo-rx7-delete-btn:hover {
        color: var(--todo-rx7-danger);
        background: var(--todo-rx7-danger-glow);
      }

      .todo-rx7-delete-btn svg {
        width: 16px;
        height: 16px;
      }

      .todo-rx7-empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--todo-rx7-text-muted);
      }

      .todo-rx7-empty-state-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: block;
        opacity: 0.5;
      }

      .todo-rx7-empty-state p {
        font-size: 15px;
      }

      .todo-rx7-empty-state p:last-child {
        font-size: 13px;
        margin-top: 4px;
        opacity: 0.7;
      }

      .todo-rx7-progress-bar-track {
        width: 100%;
        height: 4px;
        background: var(--todo-rx7-bg);
        border-radius: 2px;
        margin-bottom: 24px;
        overflow: hidden;
      }

      .todo-rx7-progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--todo-rx7-primary), var(--todo-rx7-success));
        border-radius: 2px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Sort controls */
      .todo-rx7-sort-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding: 0 4px;
      }

      .todo-rx7-sort-label {
        font-size: 13px;
        color: var(--todo-rx7-text-muted);
        font-weight: 500;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .todo-rx7-sort-label svg {
        width: 14px;
        height: 14px;
        opacity: 0.7;
      }

      .todo-rx7-sort-options {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }

      .todo-rx7-sort-btn {
        padding: 5px 12px;
        border: 1px solid var(--todo-rx7-border);
        border-radius: 8px;
        background: transparent;
        color: var(--todo-rx7-text-muted);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--todo-rx7-transition);
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      .todo-rx7-sort-btn:hover {
        color: var(--todo-rx7-text);
        border-color: rgba(245, 191, 79, 0.3);
        background: rgba(245, 191, 79, 0.05);
      }

      .todo-rx7-sort-btn--active {
        color: var(--todo-rx7-primary);
        border-color: var(--todo-rx7-primary);
        background: rgba(245, 191, 79, 0.08);
      }

      .todo-rx7-sort-btn--active:hover {
        color: var(--todo-rx7-primary-hover);
        border-color: var(--todo-rx7-primary-hover);
        background: rgba(245, 191, 79, 0.12);
      }

      .todo-rx7-sort-arrow {
        font-size: 10px;
        line-height: 1;
      }

      .todo-rx7-sort-divider {
        width: 1px;
        height: 20px;
        background: var(--todo-rx7-border);
        margin: 0 4px;
        flex-shrink: 0;
      }

      @media (max-width: 480px) {
        .todo-rx7-app-container {
          padding: 24px 18px;
        }

        .todo-rx7-input-row {
          flex-direction: column;
        }

        .todo-rx7-add-btn {
          justify-content: center;
        }

        .todo-rx7-delete-btn {
          opacity: 1;
        }

        .todo-rx7-drag-handle {
          opacity: 1;
        }

        .todo-rx7-sort-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="todo-rx7-bg-orbs"></div>
    <div id="todo-rx7-root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-type="module">
      const { useState, useEffect, useRef, useCallback } = React;

    const STORAGE_KEY = 'todo-rx7-items-v2';

    function loadTodos() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch {
        return [];
      }
    }

    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function CheckIcon() {
      return (
        <svg viewBox="0 0 24 24" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 12 10 16 18 8" />
        </svg>
      );
    }

    function TrashIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      );
    }

    function DragHandleIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <circle cx="9" cy="6" r="1.5" />
          <circle cx="15" cy="6" r="1.5" />
          <circle cx="9" cy="12" r="1.5" />
          <circle cx="15" cy="12" r="1.5" />
          <circle cx="9" cy="18" r="1.5" />
          <circle cx="15" cy="18" r="1.5" />
        </svg>
      );
    }

    function SortIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="4" y1="6" x2="16" y2="6" />
          <line x1="4" y1="12" x2="13" y2="12" />
          <line x1="4" y1="18" x2="10" y2="18" />
        </svg>
      );
    }

    function TodoApp() {
      const [todos, setTodos] = useState(loadTodos);
      const [inputVal, setInputVal] = useState('');
      const [filter, setFilter] = useState('all');
      const [sortBy, setSortBy] = useState('manual');
      const [sortDir, setSortDir] = useState('asc');
      const inputRef = useRef(null);
      const dragItemRef = useRef(null);
      const dragOverItemRef = useRef(null);
      const [dragItemId, setDragItemId] = useState(null);
      const [dragOverId, setDragOverId] = useState(null);

      useEffect(() => {
        saveTodos(todos);
      }, [todos]);

      useEffect(() => {
        inputRef.current?.focus();
      }, []);

      const addTodo = () => {
        const text = inputVal.trim();
        if (!text) return;
        setTodos(prev => [
          { id: Date.now(), text, done: false, createdAt: Date.now() },
          ...prev
        ]);
        setInputVal('');
        inputRef.current?.focus();
      };

      const toggleTodo = (id) => {
        setTodos(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      };

      const deleteTodo = (id) => {
        setTodos(prev => prev.filter(t => t.id !== id));
      };

      const clearCompleted = () => {
        setTodos(prev => prev.filter(t => !t.done));
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') addTodo();
      };

      // Drag and drop handlers
      const handleDragStart = (e, id, index) => {
        dragItemRef.current = index;
        setDragItemId(id);
        e.dataTransfer.effectAllowed = 'move';
        // Required for Firefox
        e.dataTransfer.setData('text/plain', '');
      };

      const handleDragEnter = (e, id, index) => {
        e.preventDefault();
        dragOverItemRef.current = index;
        setDragOverId(id);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDragLeave = (e, id) => {
        // Only clear if we're leaving the item entirely
        if (!e.currentTarget.contains(e.relatedTarget)) {
          if (dragOverId === id) {
            setDragOverId(null);
          }
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        if (dragItemRef.current === null || dragOverItemRef.current === null) return;
        if (dragItemRef.current === dragOverItemRef.current) {
          setDragItemId(null);
          setDragOverId(null);
          return;
        }

        // When using sorted views, we need to reorder in the actual todos array
        const displayedFiltered = getFilteredTodos();
        const sortedFiltered = getSortedTodos(displayedFiltered);

        const draggedItem = sortedFiltered[dragItemRef.current];
        const targetItem = sortedFiltered[dragOverItemRef.current];

        if (!draggedItem || !targetItem) {
          setDragItemId(null);
          setDragOverId(null);
          return;
        }

        setTodos(prev => {
          const newTodos = [...prev];
          const fromIndex = newTodos.findIndex(t => t.id === draggedItem.id);
          const toIndex = newTodos.findIndex(t => t.id === targetItem.id);
          const [removed] = newTodos.splice(fromIndex, 1);
          newTodos.splice(toIndex, 0, removed);
          return newTodos;
        });

        // Reset to manual sort after drag reorder
        setSortBy('manual');
        setDragItemId(null);
        setDragOverId(null);
        dragItemRef.current = null;
        dragOverItemRef.current = null;
      };

      const handleDragEnd = () => {
        setDragItemId(null);
        setDragOverId(null);
        dragItemRef.current = null;
        dragOverItemRef.current = null;
      };

      // Move item up or down (for mobile / keyboard)
      const moveItem = (index, direction) => {
        const sortedFiltered = getSortedTodos(getFilteredTodos());
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= sortedFiltered.length) return;

        const item = sortedFiltered[index];
        const targetItem = sortedFiltered[newIndex];

        setTodos(prev => {
          const newTodos = [...prev];
          const fromIdx = newTodos.findIndex(t => t.id === item.id);
          const toIdx = newTodos.findIndex(t => t.id === targetItem.id);
          const [removed] = newTodos.splice(fromIdx, 1);
          newTodos.splice(toIdx, 0, removed);
          return newTodos;
        });
        setSortBy('manual');
      };

      const handleSort = (type) => {
        if (sortBy === type) {
          // Toggle direction
          setSortDir(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortBy(type);
          setSortDir('asc');
        }
      };

      const getFilteredTodos = () => {
        return todos.filter(t => {
          if (filter === 'active') return !t.done;
          if (filter === 'done') return t.done;
          return true;
        });
      };

      const getSortedTodos = (filtered) => {
        if (sortBy === 'manual') return filtered;

        const sorted = [...filtered];
        const dir = sortDir === 'asc' ? 1 : -1;

        switch (sortBy) {
          case 'alpha':
            sorted.sort((a, b) => dir * a.text.localeCompare(b.text));
            break;
          case 'status':
            sorted.sort((a, b) => dir * (Number(a.done) - Number(b.done)));
            break;
          case 'date':
            sorted.sort((a, b) => dir * ((a.createdAt || a.id) - (b.createdAt || b.id)));
            break;
          default:
            break;
        }
        return sorted;
      };

      const filtered = getFilteredTodos();
      const sortedFiltered = getSortedTodos(filtered);

      const doneCount = todos.filter(t => t.done).length;
      const totalCount = todos.length;
      const progress = totalCount > 0 ? (doneCount / totalCount) * 100 : 0;

      const sortArrow = sortDir === 'asc' ? '↑' : '↓';

      return (
        <div className="todo-rx7-app-container">
          <div className="todo-rx7-header">
            <span className="todo-rx7-header-icon">✨</span>
            <h1>My Tasks</h1>
            <p>Stay organized, stay productive</p>
          </div>

          {totalCount > 0 && (
            <div className="todo-rx7-progress-bar-track">
              <div
                className="todo-rx7-progress-bar-fill"
                style={{ width: `${progress}%` }}
              />
            </div>
          )}

          <div className="todo-rx7-input-row">
            <input
              ref={inputRef}
              className="todo-rx7-input-field"
              type="text"
              placeholder="What needs to be done?"
              value={inputVal}
              onChange={e => setInputVal(e.target.value)}
              onKeyDown={handleKeyDown}
              autoFocus
            />
            <button className="todo-rx7-add-btn" onClick={addTodo}>
              <span>＋</span> Add Task
            </button>
          </div>

          {totalCount > 0 && (
            <>
              <div className="todo-rx7-filters-row">
                {['all', 'active', 'done'].map(f => (
                  <button
                    key={f}
                    className={`todo-rx7-filter-btn ${filter === f ? 'todo-rx7-filter-btn--active' : ''}`}
                    onClick={() => setFilter(f)}
                  >
                    {f === 'all' ? `All (${totalCount})` : f === 'active' ? `Active (${totalCount - doneCount})` : `Done (${doneCount})`}
                  </button>
                ))}
              </div>

              <div className="todo-rx7-sort-row">
                <span className="todo-rx7-sort-label">
                  <SortIcon />
                  Sort:
                </span>
                <div className="todo-rx7-sort-options">
                  <button
                    className={`todo-rx7-sort-btn ${sortBy === 'manual' ? 'todo-rx7-sort-btn--active' : ''}`}
                    onClick={() => { setSortBy('manual'); setSortDir('asc'); }}
                    title="Manual ordering — drag to reorder"
                  >
                    ✋ Manual
                  </button>
                  <button
                    className={`todo-rx7-sort-btn ${sortBy === 'alpha' ? 'todo-rx7-sort-btn--active' : ''}`}
                    onClick={() => handleSort('alpha')}
                    title="Sort alphabetically"
                  >
                    Aa Name {sortBy === 'alpha' && <span className="todo-rx7-sort-arrow">{sortArrow}</span>}
                  </button>
                  <button
                    className={`todo-rx7-sort-btn ${sortBy === 'date' ? 'todo-rx7-sort-btn--active' : ''}`}
                    onClick={() => handleSort('date')}
                    title="Sort by creation date"
                  >
                    🕐 Date {sortBy === 'date' && <span className="todo-rx7-sort-arrow">{sortArrow}</span>}
                  </button>
                  <button
                    className={`todo-rx7-sort-btn ${sortBy === 'status' ? 'todo-rx7-sort-btn--active' : ''}`}
                    onClick={() => handleSort('status')}
                    title="Sort by completion status"
                  >
                    ✓ Status {sortBy === 'status' && <span className="todo-rx7-sort-arrow">{sortArrow}</span>}
                  </button>
                </div>
              </div>

              <div className="todo-rx7-stats-bar">
                <span className="todo-rx7-stats-text">
                  <span>{doneCount}</span> of <span>{totalCount}</span> tasks completed
                </span>
                {doneCount > 0 && (
                  <button className="todo-rx7-clear-btn" onClick={clearCompleted}>
                    Clear completed
                  </button>
                )}
              </div>
            </>
          )}

          {sortedFiltered.length === 0 ? (
            <div className="todo-rx7-empty-state">
              <span className="todo-rx7-empty-state-icon">
                {filter === 'done' ? '🎯' : filter === 'active' ? '🎉' : '📝'}
              </span>
              <p>
                {filter === 'done'
                  ? 'No completed tasks yet'
                  : filter === 'active'
                  ? 'All tasks completed!'
                  : 'No tasks yet'}
              </p>
              <p>
                {filter === 'all' ? 'Add your first task above to get started' : 'Try changing the filter'}
              </p>
            </div>
          ) : (
            <ul className="todo-rx7-list">
              {sortedFiltered.map((todo, index) => (
                <li
                  key={todo.id}
                  className={`todo-rx7-item ${todo.done ? 'todo-rx7-item--done' : ''} ${dragItemId === todo.id ? 'todo-rx7-item--dragging' : ''} ${dragOverId === todo.id && dragItemId !== todo.id ? 'todo-rx7-item--drag-over' : ''}`}
                  draggable={sortBy === 'manual'}
                  onDragStart={(e) => handleDragStart(e, todo.id, index)}
                  onDragEnter={(e) => handleDragEnter(e, todo.id, index)}
                  onDragOver={handleDragOver}
                  onDragLeave={(e) => handleDragLeave(e, todo.id)}
                  onDrop={handleDrop}
                  onDragEnd={handleDragEnd}
                >
                  {sortBy === 'manual' && (
                    <span className="todo-rx7-drag-handle" title="Drag to reorder">
                      <DragHandleIcon />
                    </span>
                  )}
                  <button
                    className={`todo-rx7-checkbox ${todo.done ? 'todo-rx7-checkbox--checked' : ''}`}
                    onClick={() => toggleTodo(todo.id)}
                    aria-label={todo.done ? 'Mark as incomplete' : 'Mark as complete'}
                  >
                    <CheckIcon />
                  </button>
                  <span className="todo-rx7-item-text">{todo.text}</span>
                  <button
                    className="todo-rx7-delete-btn"
                    onClick={() => deleteTodo(todo.id)}
                    aria-label="Delete task"
                  >
                    <TrashIcon />
                  </button>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    const rootEl = document.getElementById('todo-rx7-root');
    ReactDOM.createRoot(rootEl).render(<TodoApp />);
  </script>
  </body>
</html>
